name: CI - Lint and Tests

on:
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  unit-tests:
    name: Run Unit Tests (only on PR to main)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: Run E2E Tests (only on PR to main)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 3000
      HASH_SALT: 10
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_SYNCHRONIZE: true
      DB_LOGGING: true
      ACCESS_TOKEN_KEY: secret-dev
      ACCESS_TOKEN_EXPIRY: 10m
      REFRESH_TOKEN_KEY: secret-dev
      REFRESH_TOKEN_EXPIRY: 7d
      FILES_PATH_TEMP: public/temp
      FILES_PATH_IMG: public/uploads
      ADMIN_EMAIL: admin@mail.com
      ADMIN_PASSWORD: admin123
      SWAGGER_TITLE: SkillSwap API
      SWAGGER_DESCRIPTION: API documentation for SkillSwap platform
      SWAGGER_VERSION: 1.0
      SWAGGER_PATH: api/docs
      SWAGGER_ENABLED: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create test env file
        run: cp .env.test.local.example .env.test.local

      - name: Run e2e tests
        run: npm run test:e2e
